<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logicc Call Trainer</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <p class="kicker">Logicc AE · Cold Call</p>
            <h1>Logicc Call Trainer</h1>
          </div>
        </div>
        <div class="roles" role="tablist" aria-label="Gegenstelle wählen">
          <button type="button" role="tab" data-role="empfang" aria-pressed="true" class="is-active">
            Empfang
          </button>
          <button type="button" role="tab" data-role="entscheider" aria-pressed="false">Entscheider</button>
        </div>
        <p id="health" class="health" data-ok="false">Prüfe API …</p>
      </header>

      <main class="grid">
        <section id="persona-card" class="card persona" aria-live="polite"></section>

        <section class="card stage">
          <div class="stage-head">
            <div id="status" class="status" data-status="idle"><i></i><strong>Bereit</strong></div>
            <p class="hint">Vollduplex: du sprichst, die Gegenstelle antwortet live. Rolle oben wechseln geht mitten im Gespräch.</p>
          </div>
          <button type="button" id="call-toggle" class="talk">Gespräch starten</button>
          <div class="stage-actions">
            <button type="button" id="mute-toggle" class="ghost" aria-pressed="false">Mikro stumm</button>
          </div>
          <p id="error" class="error" hidden></p>
        </section>

        <section class="card transcript-wrap">
          <h2>Letzte Turns</h2>
          <div id="transcript" class="transcript" aria-live="polite"></div>
        </section>

        <section class="card prompt">
          <details>
            <summary>Systemprompt (v0-Platzhalter, editierbar in <code>personas/</code>)</summary>
            <pre id="prompt-preview"></pre>
          </details>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
